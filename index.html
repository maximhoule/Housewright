<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Housewright</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: one-screen drafting table. Header, one working view, bottom tabs; edit sheets slide over the lower half so the drawing stays visible. */
  --paper:#eef1f5; --panel:#ffffff; --ink:#15233b; --mute:#5d6b82; --line:#d3dae5; --accent:#2457d6; --mark:#e8a317;
  --ok:#1f8a4c; --warn:#b06f12; --bad:#c53030; --tip:#6b5bd2;
  --f-d:'Barlow Condensed','Arial Narrow',sans-serif; --f-b:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#0d1829; --panel:#15233d; --ink:#e7edf7; --mute:#9aa9c2; --line:#2b3c5e; --accent:#7ea6ff; --mark:#f2b53a;
  --ok:#4cc38a; --warn:#e3ab4e; --bad:#f27878; --tip:#a99cf5; color-scheme:dark; } }
:root[data-theme="dark"]{
  --paper:#0d1829; --panel:#15233d; --ink:#e7edf7; --mute:#9aa9c2; --line:#2b3c5e; --accent:#7ea6ff; --mark:#f2b53a;
  --ok:#4cc38a; --warn:#e3ab4e; --bad:#f27878; --tip:#a99cf5; color-scheme:dark; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:400 15px/1.4 var(--f-b);overflow:hidden;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
#pname{font:600 20px/1.1 var(--f-d);letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;text-align:left;flex:1}
.sp{display:none}
@media (max-width:520px){#extag{display:none}}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;border:1px solid var(--line);font-weight:600;font-size:13px;white-space:nowrap;background:var(--panel)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:block}
.pill.bad i{background:var(--bad)} .pill.warn i{background:var(--warn)}
.tag{font:600 11px var(--f-b);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);border:1px dashed var(--mute);border-radius:4px;padding:1px 5px;flex:none}
.ib{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;font-size:18px;flex:none;background:var(--panel)}
.ib:disabled{opacity:.35}
main{flex:1;position:relative;min-height:0}
main>section{position:absolute;inset:0;display:none}
main>section.on{display:flex;flex-direction:column}
nav{display:flex;background:var(--panel);border-top:1px solid var(--line);flex:none;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;min-width:0;padding:6px 1px 7px;font:600 12px var(--f-d);letter-spacing:.02em;overflow:hidden;text-transform:uppercase;color:var(--mute);border-top:3px solid transparent;display:flex;flex-direction:column;align-items:center;gap:2px;white-space:nowrap}
nav button i{font:600 12px var(--f-b);width:21px;height:21px;border-radius:50%;border:1.5px solid var(--mute);display:grid;place-items:center}
nav button.on{color:var(--ink);border-top-color:var(--accent)}
nav button.on i{background:var(--accent);border-color:var(--accent);color:var(--panel)}
nav button.done i{background:var(--ok);border-color:var(--ok);color:var(--panel)}
#coach{background:var(--panel);border-top:1px solid var(--line);padding:8px 12px;display:flex;flex-direction:column;gap:6px;flex:none}
#coach p{font-size:13.5px;line-height:1.3}
#coach .btn{padding:7px 12px}
.prog{height:5px;background:var(--line);border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:9px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.opts.four{grid-template-columns:repeat(4,1fr)}
.opt{border:1.5px solid var(--line);border-radius:10px;background:var(--panel);padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.opt b{font-size:16px;font-weight:600}
.opt span{font-size:13px;color:var(--mute);line-height:1.3}
.opt.on{border-color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--panel))}
.bars{display:flex;height:30px;border-radius:6px;overflow:hidden;margin-bottom:8px;border:1px solid var(--line)}
.bars i{flex:1}
.trow{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:9px 2px;border-bottom:1px solid var(--line);font-size:13.5px;color:var(--mute);line-height:1.3}
.trow b{display:block;color:var(--ink);font-size:15px;font-weight:600}
.trow i{flex:none;width:22px;height:22px;border-radius:6px;border:1.5px solid var(--mute);margin-top:1px;position:relative}
.trow.on i{background:var(--accent);border-color:var(--accent)}
.trow.on i:after{content:"";position:absolute;left:6px;top:2px;width:6px;height:11px;border-right:2.5px solid var(--panel);border-bottom:2.5px solid var(--panel);transform:rotate(45deg)}
.warnbox{background:color-mix(in srgb,var(--warn) 13%,var(--panel));border-left:4px solid var(--warn);border-radius:6px;padding:8px 10px;font-size:13.5px}
.sum{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:14px}
.btn.big{font-size:17px;padding:14px;width:100%}
#b3d{padding:7px 12px;flex:none}
.hero{display:flex;flex-direction:column;gap:4px;border-left:5px solid var(--accent)}
.hero b{font:600 38px/1.05 var(--f-d);letter-spacing:.01em;font-variant-numeric:tabular-nums}
.bars2{display:flex;flex-direction:column;gap:9px}
.brow{display:grid;grid-template-columns:minmax(92px,28%) 1fr auto;gap:8px;align-items:center;font-size:13px}
.brow em{font-style:normal;font-variant-numeric:tabular-nums;color:var(--mute);white-space:nowrap;font-size:12.5px}
.btrack{position:relative;height:10px}
.btrack i{position:absolute;left:0;top:0;height:100%;border-radius:0 4px 4px 0;background:var(--accent)}
.btrack .bhi{opacity:.28}
.savetag{font:600 14px var(--f-b);white-space:nowrap;color:var(--ink);font-variant-numeric:tabular-nums;align-self:center}
.tbl{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:4px 6px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th:nth-child(n+2),.tbl td:nth-child(n+2){text-align:right;white-space:nowrap}
.tbl small{display:block;color:var(--mute);font-size:11.5px}
.tbl .cat td{font-weight:600;background:color-mix(in srgb,var(--ink) 5%,var(--panel))}
.tw{overflow-x:auto;flex-shrink:0}
.est{font:600 12.5px var(--f-b);color:var(--ink);border:1px solid var(--line);border-radius:99px;padding:2px 9px;white-space:nowrap;font-variant-numeric:tabular-nums;margin-left:4px}
.rrow{flex-wrap:nowrap;border-bottom:1px solid var(--line);padding:6px 0}
.rrow span{flex:1;min-width:0;font-size:14px}
.rrow small{display:block;color:var(--mute);font-size:12px}
.rrow input{width:86px;flex:none;padding:7px 8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:6px;padding:8px 12px;overflow-x:auto;flex:none;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--panel);font-weight:500;white-space:nowrap;font-size:14px}
.tabs button.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.tabs small{opacity:.65;font-size:12px;margin-left:4px}
#plan{flex:1;width:100%;min-height:0;touch-action:none;background:var(--panel);display:block;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:24px 24px;user-select:none;-webkit-user-select:none}
#plan .pl{font-family:var(--f-b);user-select:none;pointer-events:none;paint-order:stroke;stroke:var(--panel);stroke-width:.18em;stroke-linejoin:round}
#plan .pl.nb{stroke:none}
.fab{position:absolute;right:12px;bottom:12px;background:var(--accent);color:#fff;font-weight:600;padding:12px 16px;border-radius:99px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
:root[data-theme="dark"] .fab, .fab.dk{color:#0d1829}
.fit{position:absolute;right:12px;top:56px}
#lotbar{position:absolute;left:12px;right:12px;top:12px;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:10px;padding:8px 10px;display:none;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:5}#lotbar.on{display:block}#lotbar p{margin:0 0 6px;font-size:14px}
#selbar{position:absolute;left:12px;right:12px;bottom:12px;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--mark);border-radius:10px;padding:8px 10px;display:none;box-shadow:0 6px 20px rgba(0,0,0,.2)}
#selbar.on{display:block}
#selbar b{font:600 18px var(--f-d);letter-spacing:.02em}
#selbar .meta{color:var(--mute);font-size:13px;font-variant-numeric:tabular-nums}
.btn{padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:14px;white-space:nowrap}
.btn.p{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.d{color:var(--bad)}
.btn:disabled{opacity:.45}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .btn.p, :root:not([data-theme="light"]) .fab{color:#0d1829} }
:root[data-theme="dark"] .btn.p{color:#0d1829}
#gl{flex:1;width:100%;min-height:0;display:block;touch-action:none;background:#8fb1d8}
.gbar{position:absolute;left:0;right:0;padding:8px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;pointer-events:none}
.gbar>*{pointer-events:auto}
.gbar.top{top:0} .gbar.bot{bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.45));padding-top:28px;color:#fff}
.seg{display:inline-flex;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--panel)}
.seg button{padding:7px 11px;font-weight:600;font-size:14px}
.seg button.on{background:var(--ink);color:var(--panel)}
select,input[type=text],input[type=number],textarea{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;max-width:100%}
textarea{width:100%;resize:vertical;min-height:72px}
input[type=range]{accent-color:var(--accent);flex:1;min-width:90px}
.gbar.bot .btn{background:rgba(255,255,255,.92);color:#15233b;border-color:transparent}
.gbar.bot label{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;text-shadow:0 1px 2px #000}
[hidden]{display:none!important}
.hint{position:absolute;left:50%;bottom:124px;transform:translateX(-50%);background:rgba(13,24,41,.75);color:#fff;padding:4px 10px;border-radius:99px;font-size:12.5px;white-space:nowrap;pointer-events:none}
.scroll{flex:1;overflow-y:auto;padding:12px;-webkit-overflow-scrolling:touch}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h2{font:600 22px/1.15 var(--f-d);letter-spacing:.03em;text-transform:uppercase;margin:6px 0 0;text-wrap:balance}
h3{font:600 16px/1.2 var(--f-d);letter-spacing:.06em;text-transform:uppercase;margin:10px 0 2px;color:var(--mute)}
p{margin:0}
.muted{color:var(--mute);font-size:13.5px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;border-top:4px solid var(--c)}
.tile b{font:600 26px/1 var(--f-d);font-variant-numeric:tabular-nums;display:block}
.tile span{font-size:12px;color:var(--mute)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.dwg.zoom svg{width:260%!important;max-width:none}
.g3bar{position:absolute;left:8px;right:8px;bottom:118px;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:10px;padding:8px 10px;z-index:4;box-shadow:0 6px 20px rgba(0,0,0,.25)}.g3bar .row{flex-wrap:wrap;gap:6px}
.pchips{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}.pchip{display:flex;align-items:center;gap:8px;text-align:left;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit;font-size:13px;cursor:pointer}.pchip i{width:30px;height:30px;border-radius:6px;background:var(--c);flex:none;border:1px solid rgba(0,0,0,.15)}.pchip small{display:block;opacity:.6}.pchip.big i{width:48px;height:48px}
.pastebox{margin-top:8px;min-height:44px;border:1.5px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--ink);outline:none}.pastebox:empty::before{content:attr(data-ph);color:var(--mute,#888)}.pastebox:focus{border-color:var(--accent)}
.filebtn{position:relative;overflow:hidden;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}.filebtn input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:200px}
.pin{width:74px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;font:inherit;background:var(--bg);color:var(--ink)}.pin.s{width:52px}details.card summary{cursor:pointer;padding:2px 0}details.card[open] summary{margin-bottom:6px}
.chk{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:8px;padding:8px 10px;display:flex;gap:10px;align-items:flex-start}
.chk>div{flex:1;min-width:0}
.chk b{font-weight:600;display:block}
.chk p{color:var(--mute);font-size:13.5px}
.ref{font-size:11.5px;color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:0 5px;white-space:nowrap;display:inline-block;margin-top:4px}
.oklist{columns:2;column-gap:16px;font-size:13.5px;color:var(--mute);padding:0;margin:0;list-style:none}
.oklist li{break-inside:avoid;padding:2px 0 2px 16px;position:relative}
.oklist li:before{content:"";position:absolute;left:2px;top:9px;width:7px;height:4px;border-left:2px solid var(--ok);border-bottom:2px solid var(--ok);transform:rotate(-45deg)}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:62%;background:var(--panel);border-top:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.25);display:none;flex-direction:column;z-index:8}
#sheet.on{display:flex}
#sheet.tall{max-height:86%}
#sheet.mid{max-height:56%;height:56%}
#v-view3d.half #gl{flex:none;height:45%}
#v-view3d.half .gbar.bot,#v-view3d.half .hint{display:none}
.sh-h{display:flex;align-items:center;gap:8px;padding:10px 12px 4px;flex:none}
.sh-h b{font:600 20px var(--f-d);letter-spacing:.03em;text-transform:uppercase;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-b{overflow-y:auto;padding:6px 12px 16px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.fld{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--mute);font-weight:500;flex:1;min-width:92px}
.fld input,.fld select{color:var(--ink);font-size:15px;width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.sw{border:1px solid var(--line);border-radius:8px;overflow:hidden;text-align:left;background:var(--panel);display:flex;flex-direction:column}
.sw i{display:block;height:34px;background:linear-gradient(135deg,var(--c) 0 58%,var(--c2,var(--c)) 58%)}
.advc{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;background:var(--panel)}
.advc.bad{border-color:var(--warn);opacity:.82}.advc.cur{outline:2px solid var(--accent);outline-offset:-1px}.advc.ai{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
.advc p{margin:6px 0;font-size:13.5px;line-height:1.4}.advh{display:flex;flex-direction:column;gap:2px}.advh span{font-size:12.5px;opacity:.7}.advh em{font-style:normal;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;margin-right:4px}
.advwarn{color:var(--warn);font-weight:600}.advok{color:var(--ok,#2e7d4f);font-weight:600}
.advbars{display:grid;grid-template-columns:auto auto;gap:3px 12px;align-items:center;font-size:12.5px;margin:8px 0;justify-content:start}.dots{display:flex;gap:3px}.dots i{width:12px;height:6px;border-radius:3px;background:var(--line)}.dots i.on{background:var(--accent)}
.pc{margin:6px 0 8px;padding:0;list-style:none;font-size:13px;line-height:1.35}.pc li{padding-left:16px;position:relative;margin:2px 0}.pc li.p:before{content:'+';position:absolute;left:2px;font-weight:700;color:var(--ok,#2e7d4f)}.pc li.c:before{content:'−';position:absolute;left:2px;font-weight:700;color:var(--warn)}
#chatlog{display:flex;flex-direction:column-reverse;gap:8px;max-height:38vh;min-height:90px;overflow:auto;padding:4px 0 8px}
#chattext{min-height:64px}
.msg{max-width:88%;padding:8px 11px;border-radius:14px;font-size:14px;line-height:1.4}.msg p{margin:0}.msg small{display:block;margin-top:4px;opacity:.7;font-size:12px}
.msg.me{align-self:flex-end;background:var(--ink);color:var(--panel);border-bottom-right-radius:4px}.msg.ai{align-self:flex-start;background:color-mix(in srgb,var(--accent) 9%,var(--panel));border:1px solid var(--line);border-bottom-left-radius:4px}.msg .btn{margin-top:6px}
.pkg tr.grp td{background:color-mix(in srgb,var(--accent) 8%,var(--panel))}
#ptwrap.shoot #ptbtns{display:none}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}.shots figure{margin:0}.shots img{width:100%;display:block;border-radius:8px;aspect-ratio:4/3;object-fit:cover}.shots figcaption{font-size:12.5px;margin:4px 0}.shots .row{gap:4px}.shots .btn{padding:5px 8px;font-size:12.5px}
.mthumb{display:block;max-width:180px;border-radius:8px;margin-bottom:6px}.attach{display:flex;gap:8px;align-items:center;margin:8px 0;font-size:13px}.attach img{width:64px;height:64px;object-fit:cover;border-radius:8px}.attach span{flex:1}
#gmonth{width:auto;padding:4px 6px;font-size:13px;border-radius:8px;color:#15233b;background:#fff;border:1px solid rgba(0,0,0,.15)}
table.cmp{width:100%;table-layout:fixed}table.cmp tr>*:first-child{width:27%}table.cmp th{text-align:left;font-weight:600}table.cmp td,table.cmp th{vertical-align:top;padding:6px 8px;font-size:13.5px}
#vidwrap{position:fixed;inset:0;z-index:50;background:#0d0f13;display:flex;flex-direction:column;padding:10px 12px calc(12px + env(safe-area-inset-bottom));gap:8px}#vidwrap[hidden]{display:none}#vidhead{color:#fff;font-weight:600;font-size:14px}#vidbar{height:4px;background:rgba(255,255,255,.18);border-radius:2px;overflow:hidden}#vidbar i{display:block;height:100%;width:0;background:#6ea8ff}#vidstage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}#vidstage canvas{max-width:100%;max-height:100%}#vidwrap .btn{background:rgba(255,255,255,.94);color:#15233b;border-color:transparent}#vidwrap .btn.p{background:#2b6be4;color:#fff}
.plans{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:8px}.plan{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:3px;background:var(--panel)}.plan .pimg{background:#f4f6f9;border-radius:8px;height:120px;display:flex;align-items:center;justify-content:center;margin-bottom:6px;overflow:hidden}.plan .pimg svg{width:100%;height:100%}.plan small{opacity:.6;font-weight:500}.plan span{font-size:13px}
.mgrp{margin:12px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;opacity:.7;font-weight:600}.mgrp small{opacity:.7;font-weight:500}
.sw span{padding:4px 6px;font-size:12px;line-height:1.2}
.sw.on{outline:3px solid var(--mark);outline-offset:-1px}
.chip{padding:6px 10px;border-radius:99px;border:1px solid var(--line);font-size:13.5px;background:var(--panel);text-align:left}

.stylegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.stl{border:1px solid var(--line);border-radius:10px;overflow:hidden;text-align:left;background:var(--panel);display:flex;flex-direction:column;padding:0 0 7px}

.stl.on{outline:3px solid var(--mark);outline-offset:-1px}
.mood{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.mood div{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}

#ptwrap{position:absolute;inset:0;background:#0d0f13;z-index:6;display:flex;flex-direction:column}
#ptwrap[hidden]{display:none}
#ptwrap canvas,#ptwrap img{flex:1;min-height:0;width:100%;object-fit:contain;display:block}
#ptwrap img[hidden],#ptwrap canvas[hidden]{display:none}
#ptstat{padding:10px 12px 6px;color:#fff;font-size:13.5px;font-weight:600;display:flex;gap:10px;align-items:center}
#ptstat span{flex:1}#ptbar{height:4px;background:rgba(255,255,255,.18);border-radius:2px;overflow:hidden;margin:0 12px}
#ptbar i{display:block;height:100%;width:0;background:#6ea8ff;transition:width .3s}
#ptbtns{display:flex;gap:8px;flex-wrap:wrap;padding:10px 12px 12px}
#ptbtns .btn,#ptstat .btn{background:rgba(255,255,255,.94);color:#15233b;border-color:transparent}
.li{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.li>span{flex:1;min-width:0}
.op{border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px}
#toast{position:absolute;left:50%;top:10px;box-shadow:0 6px 20px rgba(0,0,0,.3);transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:8px;font-size:14px;z-index:9;max-width:88%;display:none;text-align:center}
#busy{position:absolute;inset:0;background:rgba(13,24,41,.55);z-index:8;display:none;place-items:center}
#busy.on{display:grid}
#busy>div{background:var(--panel);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;align-items:center;max-width:300px;text-align:center}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp 1s linear infinite}

@media (prefers-reduced-motion:reduce){.spin{animation:none}}
/* builder package: always drawn as a paper document */
.pkg{background:#fff;color:#111827;border:1px solid var(--line);border-radius:6px;padding:18px;font:400 13px/1.45 var(--f-b);overflow-x:auto}
.pkg h1{font:600 28px/1.1 var(--f-d);text-transform:uppercase;letter-spacing:.03em;margin:0}
.pkg h2{color:#111827;border-bottom:2px solid #111827;padding-bottom:3px;margin:22px 0 8px;font-size:19px}
.pkg h3{color:#374151;font-size:14px;margin:12px 0 4px}
.pkg table{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}
.pkg th,.pkg td{border:1px solid #c7ccd4;padding:3px 6px;text-align:left;vertical-align:top}
.pkg th{background:#eef1f5;font-weight:600}
.pkg .tb{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:0;border:2px solid #111827;margin:10px 0}
.pkg .tb div{padding:5px 8px;border-right:1px solid #c7ccd4;border-bottom:1px solid #c7ccd4}
.pkg .tb small{display:block;color:#6b7280;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em}
.pkg .tw{overflow-x:auto}
.pkg svg{width:100%;height:auto;display:block;border:1px solid #c7ccd4;margin:6px 0;background:#fff}
.pkg .pl{font-family:var(--f-b)}
.pkg .note{background:#fff7e0;border:1px solid #e3c873;padding:8px 10px;border-radius:4px}
.pkg ul{margin:4px 0;padding-left:18px}
.pkg .el{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.pkg .sev-err{color:#b42318;font-weight:600}.pkg .sev-warn{color:#93580c;font-weight:600}
@media (max-width:480px){.tiles{grid-template-columns:repeat(2,1fr)}.oklist{columns:1}}
</style>

function insertRoom(spec, src) {
  const r = makeRoom(spec, UI.lv); placeFree(r); P.rooms.push(r);
  if (UI.lv != r.lv) { UI.lv = r.lv; }
  UI.sel = r.id; UI.selItem = null; commit(); closeSheet(true); delete VB[UI.lv]; go('plan');
  toast(`${r.name} added${src == 'ai' ? ', designed by Claude' : ''}. Drag it into place.`, 3600);
}
async function askClaude(prompt, label, images) {
  if (!CAP.sample) return null;
  busyCtl = new AbortController(); busy(true, label, 'Claude is thinking. This can take up to a minute.');
  try { return await CAP.sample.json(prompt, { cache: false, signal: busyCtl.signal, ...(images && images.length ? { images } : {}) }); }
  catch (e) {
    const c = e && e.code;
    if (c == 'cancelled') return undefined;
    if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(c)) { CAP.sample = null; toast('Claude is not available in this view. Using the built-in catalog.'); }
    else if (c == 'rate_limited') toast('Claude is busy or at your usage limit. Using the built-in catalog this time.');
    else toast('Claude could not finish that. Using the built-in catalog this time.');
    return null;
  } finally { busy(false); }
}
async function generate(text) {
  text = (text || '').trim(); if (!text) { toast('Type what you want first, or pick a starting point below.'); return; }
  const raw = await askClaude(aiPrompt(text, UI.lv), 'Designing your room'); if (raw === undefined) return;
  let spec = raw ? cleanSpec(raw) : null;
  if (!spec) { const p = parseText(text); spec = cleanSpec({ ...p, items: null }); spec.items = p.items; spec.feat = [...new Set(p.feat)]; }
  UI.addText = ''; insertRoom(spec, raw ? 'ai' : '');
  const nr = byId(UI.sel); if (nr) { nr.chat = [{ who: 'me', t: text.slice(0, 1000) }, { who: 'ai', t: raw ? (spec.notes || 'Here is a first design. Tell me what to change.') : 'Built from the catalogue. Tell me what to change.', ch: [] }]; save(); }
}
function localEdit(r, text) {
  const s = ' ' + text.toLowerCase() + ' ', t = T(r), done = [];
  const m = s.match(/(\d+(?:\.\d+)?)\s*(m|ft|feet|foot|')?\s*(?:x|by|×)\s*(\d+(?:\.\d+)?)\s*(m|ft|feet|foot|')?/);
  if (m) { const u = m[4] || m[2] || (P.units == 'm' ? 'm' : 'ft'), k = u == 'm' ? 1 : .3048; r.w = r2(clamp(+m[1] * k, .9, 60)); r.d = r2(clamp(+m[3] * k, .9, 60)); done.push('size'); }
  let fl = null, n = 0; for (const [w, k] of KW_FLOOR) if (s.includes(w) && w.length > n) { fl = k; n = w.length; } if (fl) { r.floor = fl; done.push('floor'); }
  let wa = null; n = 0; for (const [w, k] of KW_WALL) if (s.includes(w) && w.length > n) { wa = k; n = w.length; } if (wa && !t.out) { r.walls = wa; done.push('walls'); }
  const rm = /remove|delete|no |without|take out/.test(s);
  for (const [w, k] of KW_ITEM) if (s.includes(w)) {
    if (rm) { const b = r.items.length; r.items = r.items.filter(i => i.k != k); if (r.items.length < b) done.push('removed ' + ITEMS[k].n.toLowerCase()); continue; }
    if (k.startsWith('bed_')) { const i = r.items.find(a => a.k.startsWith('bed_')); if (i) { i.k = k; done.push(ITEMS[k].n.toLowerCase()); continue; } }

  const use = n => { try { return window.claude && claude.use ? claude.use(n) : Promise.resolve(null); } catch (e) { return Promise.resolve(null); } };
  use('sample').then(s => { CAP.sample = s || null; if (s && s.limits) s.limits().then(l => { CAP.imgs = !!(l && l.images); if (UI.sheet) renderSheet(); }).catch(() => { }); if (UI.sheet) renderSheet(); if (UI.view == 'brief') renderBrief(); }).catch(() => { });
  use('dictation').then(d => { initMic(d); if (UI.view == 'brief') renderBrief(); }).catch(() => { });
  use('assets').then(a => { CAP.assets = a || null; if (UI.view == 'package') renderPkg(); }).catch(() => { });
  use('downloads').then(d => { CAP.dl = d || null; if (UI.view == 'package') renderPkg(); if (UI.view == 'view3d') render3DUI(); }).catch(() => { });
  Promise.all([use('db'), use('user')]).then(async ([db, user]) => {
    if (!db || !user) return; const id = await user.id(); if (!id) return;
    CAP.doc = db.doc('data/users/' + id + '/house');
    const snap = await CAP.doc.get(); const d = snap.exists && snap.data();
    if (d && typeof d.json == 'string' && (d.updated || 0) > (P.updated || 0)) { const o = JSON.parse(d.json); if (o && Array.isArray(o.rooms)) { loadProject(o); try { localStorage.setItem('housewright.v1', d.json); } catch (e) { } refresh(); toast('Loaded the design saved to your account.'); } }
    else if (P.updated) cloudSave();
  }).catch(() => { });
}
